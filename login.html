<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUSA Login</title>
  <link rel="stylesheet" href="styles.css?v=20260221b" />
</head>
<body>
  <main class="legal-container stack">
    <section class="section">
      <h1>Log In</h1>
      <p class="tiny-note">
        Use your username and password.
      </p>
      <form id="legacyLoginForm" class="stack">
        <label>
          Username
          <input id="legacyUsername" type="text" required />
        </label>
        <label>
          Password
          <input id="legacyPassword" type="password" required />
        </label>
        <button class="primary" type="submit">Log In</button>
        <p id="legacyLoginResult" class="tiny-note"></p>
      </form>
      <p><a href="index.html">Back to homepage</a></p>
    </section>
  </main>

  <script src="store.js?v=20260221b"></script>
  <script src="dataClient.js?v=20260221b"></script>
  <script>
    const form = document.getElementById("legacyLoginForm");
    const usernameInput = document.getElementById("legacyUsername");
    const passwordInput = document.getElementById("legacyPassword");
    const result = document.getElementById("legacyLoginResult");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.textContent = "";
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) {
        result.textContent = "Username and password are required.";
        return;
      }
      try {
        const data = window.LiquidGovData;
        await data.init();
        const account = await data.setCurrentUser(username, password);
        if (!account?.username) {
          throw new Error("Login failed.");
        }
        result.textContent = "Login successful. Redirecting...";
        setTimeout(() => {
          window.location.href = "app.html";
        }, 500);
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
