 [build-system]
 requires = ["setuptools>=69"]
 build-backend = "setuptools.build_meta"
 
 [project]
 name = "autoheal"
 version = "0.1.0"
 description = "Opt-in error acknowledgement, diagnosis, and auto-remediation agent."
 readme = "README.md"
 requires-python = ">=3.12"
 license = {text = "MIT"}
 authors = [{name = "Cursor Cloud Agent"}]
 keywords = ["self-healing", "ops", "daemon", "systemd", "incident"]
 classifiers = [
   "Programming Language :: Python :: 3",
   "License :: OSI Approved :: MIT License",
   "Operating System :: POSIX :: Linux",
 ]
 dependencies = []
 
 [project.scripts]
 autoheal = "autoheal.__main__:main"
 
 [tool.setuptools]
 package-dir = {"" = "src"}
 
 [tool.setuptools.packages.find]
 where = ["src"]
