<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Status: Online</title>
    <meta
      name="description"
      content="A simple, reliable website starter page."
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Your website is live</h1>
      <p class="subtitle">
        This baseline page confirms static hosting is serving your project.
      </p>

      <section class="status-card" aria-live="polite">
        <h2>Health Check</h2>
        <p>
          Status:
          <strong id="status-indicator">Checking...</strong>
        </p>
        <p class="timestamp">
          Loaded at:
          <span id="loaded-at">-</span>
        </p>
      </section>
    </main>
  </body>
</html>
