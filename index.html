<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website Status</title>
    <meta
      name="description"
      content="Simple production-ready static website starter."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Your website is live</h1>
      <p class="subtitle">
        If you can see this page, the site is being served correctly.
      </p>

      <section class="card" aria-live="polite">
        <h2>Runtime status</h2>
        <ul>
          <li><strong>Connection:</strong> <span id="connection-status">-</span></li>
          <li><strong>Current path:</strong> <span id="current-path">-</span></li>
          <li><strong>Timestamp:</strong> <span id="current-time">-</span></li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <small>&copy; <span id="year"></span> Cursor Website</small>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
